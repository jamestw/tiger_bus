services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tiger_bus
      POSTGRES_PASSWORD: tiger_bus
      POSTGRES_DB: tiger_bus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: tiger_bus
      POSTGRES_PASSWORD: tiger_bus
      POSTGRES_DB: tiger_bus_test
    ports:
      - "5433:5432"

volumes:
  postgres_data:
